# Render blueprint for the SubSense API.
#
# Deploy: push this branch, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at this repo. Render reads this file.
#
# The build step runs the full pipeline so subsense.db + ml/model.pkl exist
# before the service starts (they are gitignored generated artifacts).
services:
  - type: web
    name: subsense-api
    runtime: python
    plan: free
    buildCommand: >
      pip install -r requirements.txt &&
      python -m backend.init_db &&
      python -m ml.seed_data &&
      python -m ml.features &&
      python -m ml.train &&
      python -m ml.health
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
