<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SubSense — Thank You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0F;
    --card:#16141F;
    --border:#26232F;
    --violet:#7C3AED;
    --violet-lt:#A855F7;
    --violet-dk:#6F00BE;
    --muted:#958da1;
    --text:#e6e0ef;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{
    font-family:"Inter",ui-sans-serif,system-ui,sans-serif;color:var(--text);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  /* fixed 1600×900 canvas, scaled to fit any screen — no scrollbars while recording */
  #stage{
    width:1600px;height:900px;transform-origin:center center;
    position:relative;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
  }

  /* ambient glow */
  #stage::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(760px 520px at 50% 42%, rgba(124,58,237,.20), transparent 68%),
      radial-gradient(1100px 300px at 50% 100%, rgba(124,58,237,.08), transparent 70%);
  }

  /* slow drifting glow behind the mark */
  .aura{
    position:absolute;width:520px;height:520px;border-radius:50%;
    background:radial-gradient(circle, rgba(124,58,237,.22), transparent 62%);
    filter:blur(18px);
    animation:breathe 7s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes breathe{
    0%,100%{transform:scale(1);opacity:.75}
    50%{transform:scale(1.09);opacity:1}
  }

  .inner{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center}

  /* --- logo --- */
  .mark{
    width:82px;height:82px;border-radius:23px;
    background:linear-gradient(145deg,var(--violet-lt),var(--violet-dk));
    display:flex;align-items:center;justify-content:center;
    font-size:38px;font-weight:800;color:#fff;
    box-shadow:0 0 60px rgba(124,58,237,.5), 0 18px 44px rgba(0,0,0,.5);
    margin-bottom:26px;
  }
  .wordmark{
    font-size:23px;font-weight:600;letter-spacing:.30em;text-transform:uppercase;
    color:var(--muted);margin-bottom:34px;
  }

  /* --- headline --- */
  h1{
    font-size:104px;font-weight:800;letter-spacing:-.035em;line-height:1;
    background:linear-gradient(180deg,#ffffff 30%, #c4a5f5 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    margin-bottom:30px;
  }

  .rule{
    width:132px;height:1px;margin-bottom:30px;
    background:linear-gradient(90deg,transparent,var(--violet-lt),transparent);
  }

  /* --- tagline: four words, revealed one by one --- */
  .tagline{display:flex;gap:16px;align-items:center;margin-bottom:46px}
  .tagline span{
    font-family:"JetBrains Mono",ui-monospace,monospace;
    font-size:19px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
    color:var(--violet-lt);
  }
  .tagline .dot{color:var(--muted);opacity:.4;font-size:15px}

  /* --- footer meta --- */
  .meta{display:flex;flex-direction:column;align-items:center;gap:15px}
  .team{font-size:16.5px;color:var(--muted);letter-spacing:.02em}
  .team b{color:var(--text);font-weight:600}
  .url{
    font-family:"JetBrains Mono",monospace;font-size:13.5px;color:var(--muted);
    background:var(--card);border:1px solid var(--border);
    padding:9px 19px;border-radius:999px;
  }

  /* --- entrance animation (ends static, so a freeze-frame is safe) --- */
  .fade{opacity:0;transform:translateY(14px);animation:rise .85s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  .d1{animation-delay:.15s} .d2{animation-delay:.40s} .d3{animation-delay:.65s}
  .d4{animation-delay:.90s} .d9{animation-delay:2.55s}

  /* tagline words appear in sequence */
  .tagline > *{opacity:0;animation:rise .5s ease forwards}
  .tagline > *:nth-child(1){animation-delay:1.25s}
  .tagline > *:nth-child(2){animation-delay:1.40s}
  .tagline > *:nth-child(3){animation-delay:1.55s}
  .tagline > *:nth-child(4){animation-delay:1.70s}
  .tagline > *:nth-child(5){animation-delay:1.85s}
  .tagline > *:nth-child(6){animation-delay:2.00s}
  .tagline > *:nth-child(7){animation-delay:2.15s}

  @media (prefers-reduced-motion:reduce){
    .fade,.tagline > *{animation:none;opacity:1;transform:none}
    .aura{animation:none}
  }
</style>
</head>
<body>
<div id="stage">
  <div class="aura"></div>

  <div class="inner">
    <div class="mark fade d1">S</div>
    <div class="wordmark fade d2">SubSense</div>

    <h1 class="fade d3">Thank You</h1>
    <div class="rule fade d4"></div>

    <div class="tagline">
      <span>Predict</span><span class="dot">◆</span>
      <span>Explain</span><span class="dot">◆</span>
      <span>Act</span><span class="dot">◆</span>
      <span>Retain</span>
    </div>

    <div class="meta fade d9">
      <!-- EDIT THIS LINE with your real team name and members -->
      <div class="team">Presented by <b>Team SubSense</b> · Member One · Member Two · Member Three</div>
      <div class="url">subsense-rho.vercel.app</div>
    </div>
  </div>
</div>

<script>
  const stage = document.getElementById('stage');
  function fit(){ stage.style.transform = 'scale(' + Math.min(innerWidth/1600, innerHeight/900) + ')'; }
  addEventListener('resize', fit); fit();

  // Press R to replay the entrance animation (handy for retakes).
  addEventListener('keydown', e => {
    if (e.key.toLowerCase() !== 'r') return;
    document.querySelectorAll('.fade, .tagline > *').forEach(el => {
      const a = getComputedStyle(el).animationName;
      el.style.animation = 'none';
      void el.offsetWidth;          // force reflow so the animation restarts
      el.style.animation = '';
      void a;
    });
  });
</script>
</body>
</html>
